summary: Review a transaction boundary around an event publisher
problem: A service publishes an event before its database transaction commits, so consumers can observe state that later rolls back.
goals:
  - Identify the transaction boundary and after-commit behavior.
  - Propose a test covering both commit and rollback paths.
