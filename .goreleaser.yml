version: 2
project_name: agent-manager
dist: .goreleaser-dist
builds:
  - id: agent-manager
    main: ./cmd/agent-manager
    binary: agent-manager
    ldflags: ['-s -w']
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
archives:
  - id: default
    name_template: 'agent-manager_{{.Os}}_{{.Arch}}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: []
checksum:
  name_template: checksums.txt
  algorithm: sha256
changelog:
  use: github
release:
  github:
    owner: AllenMuu
    name: agent-manager
